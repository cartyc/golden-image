# Overlay for the golden jdk image (custom-jdk).
#
# Image-specific customizations only. The shared base layer (internal CA,
# locale) is custom-assembly/overlays/golden-base.yaml; bindings.yaml layers
# both onto custom-jdk. For a JDK image
# Custom Assembly also adds the base layer's CA to the Java truststore
# (/etc/ssl/certs/java/cacerts), so the JVM trusts internal services too.
# Reconciled by .github/workflows/custom-assembly.yaml
# (goldenctl overlay reconcile).

contents:
  # Additional packages baked into the image (from your entitled repos).
  # Adjust for jdk-specific needs; bash + curl mirror the python overlay.
  packages:
    - bash
    - curl

annotations:
  # Preserves the `LABEL origin="chainguard"` convention.
  origin: chainguard
