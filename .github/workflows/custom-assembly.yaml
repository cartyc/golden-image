name: Custom Assembly overlays

# Keep the organization's Custom Assembly Overlays and bindings in line with
# custom-assembly/ (goldenctl overlay reconcile). Chainguard assembles, signs
# and keeps rebuilding the customized images server-side.
#
#   custom-assembly/overlays/<name>.yaml  named, reusable customizations
#                                         (golden-base = internal CA + locale)
#   custom-assembly/bindings.yaml         which repos (or folder / whole org)
#                                         and which tags each overlay applies to
#
# Pull request: plan only (what would be created, updated, attached, detached).
# Merge to main: apply after registry-admin approval, like the policies lane.
# Daily: drift check that fails if the live state no longer matches the files.
#
# Repos still on standard Custom Assembly can't take bindings. For those the
# reconciler merges their all-tags layers into one config and applies it with
# `chainctl images repos build apply`, until Chainguard moves them to overlays.
#
# The CI identity needs registry.overlays.edit (the built-in editor role has
# it) plus repo.update for the standard Custom Assembly repos.
#
# A new custom repo has to be created once before anything binds to it; the
# plan prints the `chainctl images repos build edit ... --save-as` command.

on:
  push:
    branches: [main]
    paths:
      - custom-assembly/**
      - .github/workflows/custom-assembly.yaml
  pull_request:
    branches: [main]
    paths:
      - custom-assembly/**
      - goldenctl/internal/overlay/**
      - .github/workflows/custom-assembly.yaml
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: custom-assembly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # Secrets aren't available to fork PRs; the offline `overlay check` in the
    # validate workflow still covers them.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # assume the Chainguard identity
    env:
      CHAINGUARD_ORG: ${{ secrets.CHAINGUARD_ORG }}
      MODE: plan
      FAIL_ON_DRIFT: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/goldenctl
      - name: Auth to Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}
      - name: Plan overlays and bindings
        run: |
          set -o pipefail
          goldenctl overlay reconcile | tee -a "$GITHUB_STEP_SUMMARY"

  gate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: registry-admin
    permissions: {}
    steps:
      - name: Awaiting approval
        run: echo "Approved — proceeding to apply."

  apply:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CHAINGUARD_ORG: ${{ secrets.CHAINGUARD_ORG }}
      MODE: apply
      # Overlay files deleted by this push are detached and deleted.
      PREV_SHA: ${{ github.event.before }}
      CUR_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/goldenctl
      - name: Auth to Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}
      - name: Apply overlays and bindings
        run: |
          set -o pipefail
          goldenctl overlay reconcile | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Builds started
        run: |
          {
            echo "### Recent Custom Assembly builds"
            for repo in $(yq '.bindings[].scope.repos[]' custom-assembly/bindings.yaml | sort -u); do
              echo "#### ${repo}"
              echo '```'
              chainctl images repos build list --repo "$repo" --parent "$CHAINGUARD_ORG" 2>&1 | head -8 || true
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
