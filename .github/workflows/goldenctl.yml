# Build, vet and test the goldenctl CLI (the Go consolidation of the CI helper
# scripts). Keeps the binary green as commands are ported over from scripts/.
name: goldenctl
on:
  pull_request:
    paths: ["goldenctl/**"]
  push:
    branches: ["main"]
    paths: ["goldenctl/**"]
permissions: {}
jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: goldenctl
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: goldenctl/go.mod
          cache-dependency-path: goldenctl/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /dev/null .
