# Image-request intake: turn an APPROVED request issue into a ready-to-review
# catalog PR, so requesters never hand-edit YAML and reviewers never transcribe
# an issue by hand.
#
# Flow: a requester files the "Golden image request" issue form. A Platform
# Engineer reviews and adds the `approved` label. This workflow then parses the
# form, appends the cgr-sync.yaml entry (and, for the Custom Assembly lane,
# scaffolds a custom-assembly/<image>.yaml overlay stub), opens a PR that
# `Closes` the issue, and comments the PR link back on the issue. The normal
# Catalog gate + CODEOWNERS review still apply to that PR. For the Pass-through
# lane the bot also ARMS auto-merge (--auto --squash): the PR merges itself once
# Catalog gate is green AND a reviewer approves — a human stays in the loop, only
# the manual "click merge" goes away. Custom Assembly PRs stay fully manual.
# (Auto-merge needs the repo's "Allow auto-merge" setting + branch protection
# with a required review and the required Catalog gate check; without them,
# arming is a no-op and the PR just waits for a manual merge.)
#
# NOTE: a PR opened with the default GITHUB_TOKEN does NOT trigger other
# workflows (GitHub's recursion guard), so Catalog gate won't auto-run on the
# bot PR. To make it self-gate, provide ONE of (checked in this order):
#   1. a GitHub App — secrets INTAKE_APP_ID + INTAKE_APP_PRIVATE_KEY (recommended:
#      short-lived token, scoped to this repo's contents + pull-requests), or
#   2. a fine-grained PAT in the INTAKE_PAT secret (contents + pull-requests write).
# With neither, the PR is still opened via GITHUB_TOKEN; the gates run on the
# first human push/label.
name: Image request intake
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  intake:
    # Only when the `approved` label is added to an `image-request` issue.
    if: >-
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'image-request')
    runs-on: ubuntu-latest
    env:
      # Prefer a GitHub App token so the bot-opened PR triggers Catalog gate
      # (a PR opened with the default GITHUB_TOKEN does not). See header note.
      HAS_APP: ${{ secrets.INTAKE_APP_ID != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/goldenctl
      - name: Mint a GitHub App token (if configured)
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.INTAKE_APP_ID }}
          private-key: ${{ secrets.INTAKE_APP_PRIVATE_KEY }}

      - name: Parse the request
        id: parse
        env:
          GITHUB_ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          goldenctl intake parse > req.json
          echo "Parsed request:"; cat req.json

      - name: Apply the catalog change
        id: change
        run: |
          set -euo pipefail
          name=$(jq -r .repo_name req.json)
          image=$(jq -r .image req.json)
          tags=$(jq -r '.tags | join(",")' req.json)
          is_custom=$(jq -r .is_custom req.json)

          goldenctl catalog add --name "$name" --tags "$tags"

          # Custom Assembly lane: scaffold an overlay stub if one doesn't exist.
          overlay="custom-assembly/${image}.yaml"
          if [ "$is_custom" = "true" ] && [ ! -f "$overlay" ]; then
            goldenctl intake overlay --out "$overlay" --req req.json
          fi

          # nothing changed? (idempotent re-approve) — stop cleanly
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the catalog PR
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.INTAKE_PAT || secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          name=$(jq -r .repo_name req.json)
          tags=$(jq -r '.tags | join(", ")' req.json)
          is_custom=$(jq -r .is_custom req.json)
          lane=$(jq -r 'if .is_custom then "Custom Assembly" else "Pass-through" end' req.json)
          owner=$(jq -r .owner req.json)
          fips=$(jq -r 'if .fips_required then "Yes" else "No" end' req.json)
          branch="intake/issue-${ISSUE}"

          git config user.name "golden-image-intake[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          rm -f req.json
          git add -A
          git commit -m "intake: add ${name} (${tags}) from image request #${ISSUE}

          Requested by ${owner}. Lane: ${lane}. FIPS: ${fips}.
          Closes #${ISSUE}."
          git push -u origin "$branch"

          body=$(cat <<EOF
          Automated from image request #${ISSUE}.

          | Field | Value |
          |---|---|
          | Repo (in \`cgr-sync.yaml\`) | \`${name}\` |
          | Tags | ${tags} |
          | Lane | ${lane} |
          | FIPS required | ${fips} |
          | Requesting team | ${owner} |

          Closes #${ISSUE}

          ## Reviewer checklist (Platform Engineering)
          - [ ] Tag(s) pinned (not only \`latest\`)
          - [ ] Custom Assembly overlay (if any) completed + packages on the allowlist
          - [ ] FIPS requirement satisfied
          - [ ] **Catalog gate** green (conftest + policies check + CVE scan)

          > Opened by the intake bot. If Catalog gate did not run, configure an intake GitHub App or \`INTAKE_PAT\` (see the workflow header).
          EOF
          )
          pr_url=$(gh pr create --base main --head "$branch" \
            --title "intake: ${name} (${tags}) — request #${ISSUE}" \
            --body "$body")
          echo "PR: $pr_url"

          # Pass-through lane: arm auto-merge so the PR merges ITSELF once every
          # branch-protection condition is met — i.e. Catalog gate is green AND a
          # human reviewer (CODEOWNERS) approves. This removes the manual "click
          # merge" chore but keeps a human in the loop; GitHub won't merge until
          # the required review lands. Custom Assembly PRs touch overlay files and
          # stay fully manual. Needs repo "Allow auto-merge" + branch protection
          # with required review + required Catalog gate check; if either is
          # missing, arming is a no-op warning and the PR just waits for a manual
          # merge (unchanged behaviour).
          automerge_note=""
          if [ "$is_custom" != "true" ]; then
            if gh pr merge --auto --squash "$pr_url"; then
              automerge_note=" Auto-merge is armed — it will merge once Catalog gate is green and a reviewer approves."
            else
              echo "::warning::could not arm auto-merge (repo auto-merge disabled or no branch protection?) — PR will wait for a manual merge"
            fi
          fi
          gh issue comment "$ISSUE" --body "✅ Approved — opened catalog PR: ${pr_url}. Platform Engineering will review the gate results there.${automerge_note}"

      - name: Nothing to change
        if: steps.change.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.INTAKE_PAT || secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body "ℹ️ Approved, but the catalog already contains this image + tags — no PR needed."
