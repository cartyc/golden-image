# Unified lifecycle for BOTH the Chainguard container pull policies
# (registry-policies/) and the Libraries policies (library-policies/).
#   PR    -> plan:  preview create/update/delete for both, plus a catalog
#            policy-status snapshot and the current library bindings.
#   main  -> gate + apply: an approver signs off (gate), then reconcile
#            definitions + bindings for both and prune removed ones.
#
# Approval gate: the `registry-admin` environment sits on an approval-only `gate`
# job that requests NO OIDC token, so it never trips the identity's subject
# check. `apply` depends on `gate` but runs OUTSIDE the environment, so its OIDC
# subject stays repo:<owner>/<repo>:ref:refs/heads/main — the subject the
# Chainguard assumable identity trusts. Add a required reviewer to
# `registry-admin` to make the gate real.
#
# Prune is DIFF-BASED for both folders (only deletes specs removed in the merge),
# so policies created outside this repo are never touched.
#
# NOTE: the CI identity needs both policies.policy.* (container) and
# libraries.policy.* (libraries) capabilities.
name: Policies
on:
  pull_request:
    paths: ["registry-policies/**", "library-policies/**", "goldenctl/**"]
  push:
    branches: ["main"]
    paths: ["registry-policies/**", "library-policies/**"]
  workflow_dispatch: {}
permissions: {}
jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CHAINGUARD_ORG: ${{ secrets.CHAINGUARD_ORG }}
      MODE: plan
      PREV_SHA: ${{ github.event.pull_request.base.sha }}
      CUR_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/goldenctl
      - name: Auth to Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}
      - name: Plan registry policies (validate + preview)
        run: |
          set -o pipefail
          goldenctl policy reconcile | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Policy status for the golden catalog (informational)
        run: |
          {
            echo "### Current policy status — golden catalog"
            echo "_How today's catalog images fare against the **currently-enabled** policies_"
            echo "_(a snapshot; newly-added policies here are not enabled until you bind them)._"
            echo
            while read -r ref; do
              [ -z "$ref" ] && continue
              if chainctl policies check "$ref" >/dev/null 2>&1; then
                echo "- ALLOWED  \`$ref\`"
              else
                echo "- DENIED   \`$ref\`"
              fi
            done < <(goldenctl catalog refs)
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Plan registry bindings (preview enable)
        run: |
          set -o pipefail
          goldenctl policy bindings | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Plan library policies (preview)
        run: |
          set -o pipefail
          goldenctl policy libraries | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Current library bindings (informational)
        run: |
          {
            echo "### Current Libraries policy bindings"
            echo "_Active policies per ecosystem (PREVIEW records only; ENFORCE blocks pulls)._"
            echo '```'
            chainctl libraries policy binding list --parent "$CHAINGUARD_ORG" 2>/dev/null || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: registry-admin
    permissions: {}
    steps:
      - name: Awaiting approval
        run: echo "Approved — proceeding to apply."

  apply:
    if: github.event_name != 'pull_request'
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CHAINGUARD_ORG: ${{ secrets.CHAINGUARD_ORG }}
      MODE: apply
      PREV_SHA: ${{ github.event.before }}
      CUR_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/goldenctl
      - name: Auth to Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}
      - name: Apply registry policies (create/update + prune)
        run: |
          set -o pipefail
          goldenctl policy reconcile | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Apply registry bindings (enable)
        run: |
          set -o pipefail
          goldenctl policy bindings | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Apply library policies (create/update + prune)
        run: |
          set -o pipefail
          goldenctl policy libraries | tee -a "$GITHUB_STEP_SUMMARY"
