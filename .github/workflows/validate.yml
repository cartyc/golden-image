name: validate

# actionlint WITH shellcheck on every workflow run: block. The rest of the lint
# (actionlint, yamllint, configs parse, goldenctl overlay check) runs in the
# Chainguard Checks `lint` and `goldenctl` checks (.chainguard/ci/repo.yaml).
# This job stays because the Checks VM has no shellcheck (there's no Wolfi
# package), so actionlint there skips the run: scripts. The ubuntu-latest
# runner image ships shellcheck, and actionlint uses it when it's on PATH.

on:
  pull_request:
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]

permissions:
  contents: read

jobs:
  actionlint-shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: shellcheck is on PATH
        # Without it actionlint silently skips run: scripts, and this job adds nothing.
        run: shellcheck --version

      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
