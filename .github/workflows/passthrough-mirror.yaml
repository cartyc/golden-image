name: Passthrough mirror (cgr-sync)

# Mirror pass-through Chainguard images straight into the golden-images registry
# (private GitHub Container Registry packages, ghcr.io/<owner>/golden/<image>)
# using cgr-sync (github.com/cartyc/image-syncer). This preserves multi-arch
# indexes and the upstream cosign signatures/attestations — which a docker
# build/push flattens away — and verifies each image's signature before copying.
# Complements the per-image build pipelines, which TRANSFORM images.

on:
  # Reconcile on a timer AND right after the catalog changes on main, so a newly
  # approved image lands in the golden registry immediately instead of waiting up
  # to 6h for the next cron. Scoped to cgr-sync.yaml, the mirror's catalog. That
  # catalog includes the Custom Assembly images (custom-python, custom-jdk),
  # which this job mirrors like any other entry. A custom-assembly/** change
  # isn't a trigger: Chainguard rebuilds those images server-side after the
  # custom-assembly workflow applies the overlays, so the new digests are picked
  # up by the next scheduled (or manual) run.
  push:
    branches: ["main"]
    paths: ["cgr-sync.yaml"]
  schedule:
    - cron: "0 */6 * * *" # reconcile the catalog every 6h
  workflow_dispatch: {}

# Serialize mirror runs — a manual run and a scheduled run (or an overrunning
# previous run) must not race on the same registry pushes. New runs
# queue rather than cancel, so an in-flight mirror always finishes.
concurrency:
  group: passthrough-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    outputs:
      # "ok" once the guard passed, so verify only runs after a real mirror.
      guard: ${{ steps.guard.outputs.result }}
    permissions:
      contents: read
      id-token: write # OIDC token for setup-chainctl (cgr.dev source auth)
      packages: write # push the mirrored images to ghcr.io with GITHUB_TOKEN
    env:
      # Consumed by cgr-sync.yaml as ${CHAINGUARD_ORG} (source namespace),
      # ${DEST_REGISTRY} (destination), and ${CHAINGUARD_ORG_UIDP} (verify regexp).
      CHAINGUARD_ORG: ${{ secrets.CHAINGUARD_ORG }}
      # ghcr.io/<owner>/golden unless the DEST_REGISTRY repo variable overrides
      # it; lowercased at login (OCI repository names must be lowercase).
      DEST_REGISTRY: ${{ vars.DEST_REGISTRY || format('ghcr.io/{0}/golden', github.repository_owner) }}
      CHAINGUARD_ORG_UIDP: ${{ secrets.CHAINGUARD_ORG_UIDP }}
    steps:
      - name: Checkout (golden-image)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Auth to Chainguard source (cgr.dev)
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}

      - name: Install cosign (verify-before-mirror)
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      # The built-in token, scoped by `packages: write` above. cgr-sync, cosign
      # and grype all read the host Docker config this writes.
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "DEST_REGISTRY=${DEST_REGISTRY,,}" >> "$GITHUB_ENV"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - uses: ./.github/actions/goldenctl

      # Push only to packages that already exist and are private. This
      # repository is public, and a package a workflow creates with
      # GITHUB_TOKEN inherits the repository's visibility, so letting the
      # mirror create one would make it public, for good. The guard fails
      # if any destination package is missing, public, or not granted to this
      # repository; the packages are pre-created by hand (README: "Pre-create
      # the golden packages").
      - name: Guard — destination packages exist and are private
        id: guard
        run: |
          goldenctl catalog guard
          echo "result=ok" >> "$GITHUB_OUTPUT"

      # Pull the pinned cgr-sync release image and extract its binary, instead
      # of checking out the source and building it. The binary runs on the
      # runner so it reuses the host keychain (cgr.dev + ghcr.io auth above) and the
      # host cosign for verify-before-mirror. Bump CGR_SYNC_IMAGE to upgrade.
      - name: Fetch cgr-sync binary
        env:
          CGR_SYNC_IMAGE: ghcr.io/cartyc/image-syncer:v0.1.3
        run: |
          cid=$(docker create "$CGR_SYNC_IMAGE")
          docker cp "$cid:/usr/bin/cgr-sync" "$RUNNER_TEMP/cgr-sync"
          docker rm "$cid" >/dev/null
          "$RUNNER_TEMP/cgr-sync" -version

      - name: Mirror images
        run: |
          "$RUNNER_TEMP/cgr-sync" sync -config cgr-sync.yaml -continue-on-error

  # Independently verify the golden images that landed in the golden registry:
  # a grype CVE scan (gate) plus a cosign SBOM-attestation check. Runs after the
  # mirror whatever its outcome (so images that did land are still checked), but
  # only once the guard has passed. Every catalog ref must be present: a missing
  # one fails, unless VERIFY_ALLOW_MISSING lists it (README: "Verify failures").
  verify:
    needs: mirror
    if: ${{ always() && needs.mirror.outputs.guard == 'ok' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull the mirrored images from ghcr.io with GITHUB_TOKEN
    env:
      DEST_REGISTRY: ${{ vars.DEST_REGISTRY || format('ghcr.io/{0}/golden', github.repository_owner) }}
      # Expands the verify identity regexp in cgr-sync.yaml for the helper below.
      CHAINGUARD_ORG_UIDP: ${{ secrets.CHAINGUARD_ORG_UIDP }}
      # Lowest severity that fails the scan; override with a repo/org variable.
      GRYPE_FAIL_ON: ${{ vars.GRYPE_FAIL_ON || 'critical' }}
      # Space- or comma-separated `name` or `name:tag` entries that may be absent
      # without failing, e.g. a Custom Assembly image whose source tag isn't
      # built yet. Empty by default; each entry needs a reason (README).
      VERIFY_ALLOW_MISSING: ${{ vars.VERIFY_ALLOW_MISSING || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: ./.github/actions/goldenctl

      # The built-in token, scoped by `packages: read` above. cosign and grype
      # read the host Docker config this writes.
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "DEST_REGISTRY=${DEST_REGISTRY,,}" >> "$GITHUB_ENV"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      # Pinned release tarball, the same version as catalog-gate.yml — bump both
      # together so the PR gate and the post-mirror scan agree.
      - name: Install grype
        run: |
          ver=0.117.0
          curl -sSfL "https://github.com/anchore/grype/releases/download/v${ver}/grype_${ver}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin grype
          grype version

      - name: Scan + verify golden images
        run: |
          set -uo pipefail
          goldenctl catalog golden-images > "$RUNNER_TEMP/images.tsv"
          allow=" ${VERIFY_ALLOW_MISSING//,/ } "
          fail=0
          while IFS=$'\t' read -r name tag issuer identity idregex; do
            ref="${DEST_REGISTRY}/${name}:${tag}"
            if ! err=$(docker manifest inspect "$ref" 2>&1 >/dev/null); then
              if [[ "$allow" == *" ${name} "* || "$allow" == *" ${name}:${tag} "* ]]; then
                echo "::warning::${ref} is missing; allowed by VERIFY_ALLOW_MISSING"
              else
                echo "::error::${ref} is missing after the mirror run (${err:-no detail}). Check the mirror job's log for this ref"
                fail=1
              fi
              continue
            fi
            echo "::group::verify ${ref}"

            # CVE gate.
            if grype "$ref" --fail-on "$GRYPE_FAIL_ON" -q; then
              echo "grype: ok (no findings >= ${GRYPE_FAIL_ON})"
            else
              echo "::error::grype found findings >= ${GRYPE_FAIL_ON} in ${ref}"; fail=1
            fi

            # SBOM attestation, signed by the same identity cgr-sync mirrors
            # under. The helper emits "-" for unset fields (never an empty
            # column), so a regexp-only policy can't collapse into the identity
            # slot during the tab-delimited read above.
            args=(--type spdx --certificate-oidc-issuer "$issuer")
            [ "$identity" != "-" ] && args+=(--certificate-identity "$identity")
            [ "$idregex" != "-" ]  && args+=(--certificate-identity-regexp "$idregex")
            if cosign verify-attestation "${args[@]}" "$ref" >/dev/null 2>&1; then
              echo "cosign: SBOM attestation verified"
            else
              echo "::error::SBOM attestation verification failed for ${ref}"; fail=1
              # Surface why: re-run without suppression, and list what cosign can
              # actually discover on the mirror (sig/att tags + referrers).
              echo "--- cosign verify-attestation stderr ---"
              cosign verify-attestation "${args[@]}" "$ref" || true
              echo "--- cosign tree ${ref} ---"
              cosign tree "$ref" || true
            fi

            echo "::endgroup::"
          done < "$RUNNER_TEMP/images.tsv"
          exit $fail
