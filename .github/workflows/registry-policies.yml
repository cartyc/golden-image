# Lifecycle for the Chainguard custom pull policies in registry-policies/.
#   PR   -> plan: validate every manifest + preview create/update/delete (no changes).
#   main -> apply: create/update present manifests, delete removed ones (prune),
#           behind the `registry-admin` environment so an approver signs off.
# The folder is the source of truth for the custom policies this repo manages;
# prune is DIFF-BASED (only deletes manifests removed in the merge), so policies
# created outside this repo are never touched.
name: Registry policies
on:
  pull_request:
    paths: ["registry-policies/**", "scripts/reconcile-registry-policies.sh"]
  push:
    branches: ["main"]
    paths: ["registry-policies/**"]
  workflow_dispatch: {}
permissions: {}
jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Auth to Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}
      - name: Plan (validate + preview create/update/delete)
        env:
          CHAINGUARD_ORG: ${{ secrets.CHAINGUARD_ORG }}
          MODE: plan
          PREV_SHA: ${{ github.event.pull_request.base.sha }}
          CUR_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/reconcile-registry-policies.sh | tee -a "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # environment: registry-admin
    # ^ Approval gate is DISABLED for now: a GitHub Environment changes the OIDC
    #   token subject to repo:<owner>/<repo>:environment:registry-admin, which the
    #   Chainguard assumable identity (CHAINGUARD_IDENTITY) does not trust yet, so
    #   setup-chainctl fails with "invalid subject". To re-enable the gate:
    #     1) add that subject to the identity's claim match, e.g. subject_pattern
    #        repo:cartyc/golden-image:(ref:refs/heads/main|pull_request|environment:registry-admin)
    #     2) uncomment the line above and add a required reviewer to the environment.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Auth to Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}
      - name: Apply (create/update + prune removed)
        env:
          CHAINGUARD_ORG: ${{ secrets.CHAINGUARD_ORG }}
          MODE: apply
          PREV_SHA: ${{ github.event.before }}
          CUR_SHA: ${{ github.sha }}
        run: bash scripts/reconcile-registry-policies.sh | tee -a "$GITHUB_STEP_SUMMARY"
