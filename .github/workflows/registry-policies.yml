# Lifecycle for the Chainguard custom pull policies in registry-policies/.
#   PR    -> plan:  validate manifests + preview create/update/delete, and show
#            how today's catalog images fare against currently-enabled policies.
#   main  -> gate + apply: an approver signs off (gate), then create/update present
#            manifests and prune removed ones (apply).
#
# Approval gate design: the `registry-admin` environment sits on a tiny approval-
# only `gate` job that requests NO OIDC token, so it never trips the identity's
# subject check. `apply` depends on `gate` but runs OUTSIDE the environment, so
# its OIDC subject stays repo:<owner>/<repo>:ref:refs/heads/main — the one the
# Chainguard assumable identity already trusts. Add a required reviewer to the
# `registry-admin` environment (repo Settings -> Environments) to make the gate
# real; until then it passes through.
#
# Prune is DIFF-BASED (only deletes manifests removed in the merge), so policies
# created outside this repo are never touched.
name: Registry policies
on:
  pull_request:
    paths: ["registry-policies/**", "goldenctl/**"]
  push:
    branches: ["main"]
    paths: ["registry-policies/**"]
  workflow_dispatch: {}
permissions: {}
jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: goldenctl/go.mod, cache-dependency-path: goldenctl/go.sum }
      - name: Build goldenctl
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -C goldenctl -o "$RUNNER_TEMP/bin/goldenctl" .
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Auth to Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}
      - name: Plan (validate + preview create/update/delete)
        env:
          CHAINGUARD_ORG: ${{ secrets.CHAINGUARD_ORG }}
          MODE: plan
          PREV_SHA: ${{ github.event.pull_request.base.sha }}
          CUR_SHA: ${{ github.event.pull_request.head.sha }}
        # pipefail so a reconcile failure (e.g. an invalid policy manifest)
        # isn't masked by the exit status of `tee`.
        run: |
          set -o pipefail
          goldenctl policy reconcile | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Policy status for the golden catalog (informational)
        env:
          CHAINGUARD_ORG: ${{ secrets.CHAINGUARD_ORG }}
        run: |
          {
            echo "### Current policy status — golden catalog"
            echo "_How today's catalog images fare against the **currently-enabled** policies_"
            echo "_(a snapshot; newly-added policies here are not enabled until you bind them)._"
            echo
            while read -r ref; do
              [ -z "$ref" ] && continue
              if chainctl policies check "$ref" >/dev/null 2>&1; then
                echo "- ALLOWED  \`$ref\`"
              else
                echo "- DENIED   \`$ref\`"
              fi
            done < <(goldenctl catalog refs)
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Plan bindings (preview enable)
        env:
          CHAINGUARD_ORG: ${{ secrets.CHAINGUARD_ORG }}
          MODE: plan
        run: |
          set -o pipefail
          goldenctl policy bindings | tee -a "$GITHUB_STEP_SUMMARY"

  gate:
    # Approval-only. Requests no OIDC token, so the environment's subject never
    # reaches setup-chainctl. Add a required reviewer to `registry-admin` to gate.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: registry-admin
    permissions: {}
    steps:
      - name: Awaiting approval
        run: echo "Approved — proceeding to apply."

  apply:
    if: github.event_name != 'pull_request'
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: goldenctl/go.mod, cache-dependency-path: goldenctl/go.sum }
      - name: Build goldenctl
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -C goldenctl -o "$RUNNER_TEMP/bin/goldenctl" .
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Auth to Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}
      - name: Apply (create/update + prune removed)
        env:
          CHAINGUARD_ORG: ${{ secrets.CHAINGUARD_ORG }}
          MODE: apply
          PREV_SHA: ${{ github.event.before }}
          CUR_SHA: ${{ github.sha }}
        # pipefail so a reconcile failure isn't masked by `tee` (see plan job).
        run: |
          set -o pipefail
          goldenctl policy reconcile | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Apply bindings (enable)
        env:
          CHAINGUARD_ORG: ${{ secrets.CHAINGUARD_ORG }}
          MODE: apply
        run: |
          set -o pipefail
          goldenctl policy bindings | tee -a "$GITHUB_STEP_SUMMARY"
