# Library-unblock intake: turn an APPROVED "library unblock request" issue into a
# ready-to-review PR that adds the exception to golden-libraries.yaml, so
# requesters never hand-edit the policy and reviewers never transcribe a purl.
#
# Flow: a requester files the "Library unblock request" issue form (a package the
# libraries.cgr.dev gates blocked). A Platform Engineer reviews and adds the
# `approved` label. This workflow parses the form, edits
# library-policies/golden-libraries.yaml (adds an `allow` exception with the
# right cooldown/malware overrides, and drops a matching `block` line), opens a
# PR that `Closes` the issue, and comments the PR link back. The Policies plan +
# CODEOWNERS review still apply to that PR, and it takes effect on merge+apply.
#
# NOTE: a PR opened with the default GITHUB_TOKEN does NOT trigger other
# workflows (GitHub's recursion guard). To make dependent gates run on the bot
# PR, provide ONE of (checked in this order):
#   1. a GitHub App — secrets INTAKE_APP_ID + INTAKE_APP_PRIVATE_KEY, or
#   2. a fine-grained PAT in the INTAKE_PAT secret (contents + pull-requests write).
# With neither, the PR is still opened via GITHUB_TOKEN.
name: Library unblock intake
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  unblock:
    # Only when the `approved` label is added to a `library-unblock` issue.
    if: >-
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'library-unblock')
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.INTAKE_APP_ID != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/goldenctl
      - name: Mint a GitHub App token (if configured)
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.INTAKE_APP_ID }}
          private-key: ${{ secrets.INTAKE_APP_PRIVATE_KEY }}

      - name: Parse the request
        id: parse
        env:
          GITHUB_ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          goldenctl intake parse-unblock > unblock.json
          echo "Parsed request:"; cat unblock.json

      - name: Apply the policy change
        id: change
        run: |
          set -euo pipefail
          goldenctl intake unblock-apply --req unblock.json --file library-policies/golden-libraries.yaml
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the unblock PR
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.INTAKE_PAT || secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          eco=$(jq -r .ecosystem unblock.json)
          purl=$(jq -r .purl unblock.json)
          owner=$(jq -r .owner unblock.json)
          oc=$(jq -r 'if .override_cooldown then "yes" else "no" end' unblock.json)
          om=$(jq -r 'if .override_malware then "yes" else "no" end' unblock.json)
          rm=$(jq -r 'if .remove_from_block then "yes" else "no" end' unblock.json)
          branch="unblock/issue-${ISSUE}"

          git config user.name "golden-image-intake[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          rm -f unblock.json
          git add -A
          git commit -m "libraries: allow ${purl} from unblock request #${ISSUE}

          Requested by ${owner} (${eco}). Overrides — cooldown: ${oc}, malware: ${om}.
          Closes #${ISSUE}."
          git push -u origin "$branch"

          body=$(cat <<EOF
          Automated from library unblock request #${ISSUE}.

          | Field | Value |
          |---|---|
          | Ecosystem | ${eco} |
          | Package (purl) | \`${purl}\` |
          | Override cooldown | ${oc} |
          | Override malware | ${om} |
          | Removed from blocklist | ${rm} |
          | Requesting team | ${owner} |

          Closes #${ISSUE}

          ## Reviewer checklist (Platform Engineering)
          - [ ] Package + version are what was requested
          - [ ] Override scope is minimal (a **version** exception, not the whole package, where possible)
          - [ ] **Malware** override (if any) is justified — this waives a real safety gate
          - [ ] Justification is adequate

          > Opened by the intake bot. Takes effect on merge, when the Policies workflow applies \`golden-libraries.yaml\`.
          EOF
          )
          pr_url=$(gh pr create --base main --head "$branch" \
            --title "libraries: allow ${purl} — unblock #${ISSUE}" \
            --body "$body")
          echo "PR: $pr_url"
          gh issue comment "$ISSUE" --body "✅ Approved — opened unblock PR: ${pr_url}. Platform Engineering will review it there."

      - name: Nothing to change
        if: steps.change.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.INTAKE_PAT || secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body "ℹ️ Approved, but that package is already allowed in \`golden-libraries.yaml\` — no PR needed."
