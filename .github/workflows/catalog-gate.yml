# Gate on catalog change requests (PRs touching the pass-through catalog or the
# Custom Assembly overlays). Two independent checks, both required by branch
# protection:
#   1. conftest — the catalog entry is well-formed and within policy
#      (allowed source, pinned tags, package allowlist). Runs offline.
#   2. chainctl policies check — the requested image would pass the REGISTRY's
#      active pull policies (fips-required / min-version / no-eol / ...). A
#      DENIED here (even DRY_RUN) fails the PR, so a non-compliant image never
#      gets promoted into the golden registry.
name: Catalog gate
on:
  pull_request:
    paths: ["cgr-sync.yaml", "custom-assembly/**"]
  workflow_dispatch: {}
permissions: {}
jobs:
  conftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install conftest
        run: |
          ver=0.56.0
          curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${ver}/conftest_${ver}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest
      - name: Policy-check the catalog + overlays
        run: |
          conftest test --policy policy/conftest --all-namespaces cgr-sync.yaml
          conftest test --policy policy/conftest --all-namespaces custom-assembly/*.yaml

  policies-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Auth to Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}
      - name: Check requested images against active registry policies
        env:
          CHAINGUARD_ORG: ${{ secrets.CHAINGUARD_ORG }}
        run: |
          set -euo pipefail
          # Emit "repo:tag" source refs from the catalog and check each one.
          # A DENIED/ERROR from any active policy exits non-zero and fails the PR.
          fail=0
          # list-source-refs.py emits fully-qualified refs (cgr.dev/$ORG/repo:tag)
          # with ${VAR} expanded from the env, so check each ref as-is.
          while read -r ref; do
            [ -z "$ref" ] && continue
            echo "::group::policies check $ref"
            if chainctl policies check "$ref"; then
              echo "  ALLOWED: $ref"
            else
              echo "::error::registry policy DENIED $ref"; fail=1
            fi
            echo "::endgroup::"
          done < <(python3 scripts/list-source-refs.py)
          exit $fail
