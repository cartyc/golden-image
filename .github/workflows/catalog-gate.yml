# Gate on catalog change requests (PRs touching the pass-through catalog or the
# Custom Assembly overlays). Three independent checks, all required by branch
# protection:
#   1. conftest — the catalog entry is well-formed and within policy
#      (allowed source, pinned tags, package allowlist). Runs offline.
#   2. chainctl policies check — the requested image would pass the REGISTRY's
#      active pull policies (fips-required / min-version / max-age / no-eol).
#      An ENFORCE denial fails the PR (a non-compliant image never gets
#      promoted); a DRY_RUN denial is a warning, so observe-mode policies inform
#      the reviewer without blocking.
#   3. cve-scan — grype scans each requested image and fails the PR if its
#      Critical/High CVE counts exceed the thresholds. Pull policies can't see
#      CVEs (their input is package lifecycle metadata only), so this scanner
#      step is where the actual CVE-COUNT gate lives.
name: Catalog gate
on:
  pull_request:
    paths: ["cgr-sync.yaml", "custom-assembly/**"]
  workflow_dispatch: {}
permissions: {}
jobs:
  conftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install conftest
        run: |
          ver=0.56.0
          curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${ver}/conftest_${ver}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest
      - name: Policy-check the catalog + overlays
        run: |
          conftest test --policy policy/conftest --all-namespaces cgr-sync.yaml
          conftest test --policy policy/conftest --all-namespaces custom-assembly/*.yaml

  policies-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Auth to Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}
      - name: Check requested images against active registry policies
        env:
          CHAINGUARD_ORG: ${{ secrets.CHAINGUARD_ORG }}
        run: |
          set -euo pipefail
          # Fail only on ENFORCE denials; DRY_RUN denials are reported as
          # warnings so observe-mode policies inform without blocking the PR
          # (see scripts/check-policies.py). list-source-refs.py emits
          # fully-qualified refs (cgr.dev/$ORG/repo:tag) with ${VAR} expanded.
          python3 scripts/list-source-refs.py | python3 scripts/check-policies.py

  cve-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # setup-chainctl configures the cgr.dev cred helper so grype can pull
    env:
      # Golden-catalog thresholds. Tune per org risk appetite; -1 = unlimited.
      MAX_CRITICAL: "0"
      MAX_HIGH: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Auth to Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}
      - name: Install grype
        run: |
          ver=0.117.0
          curl -sSfL "https://github.com/anchore/grype/releases/download/v${ver}/grype_${ver}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin grype
      - name: Scan requested images against CVE thresholds
        env:
          CHAINGUARD_ORG: ${{ secrets.CHAINGUARD_ORG }}
        run: |
          set -euo pipefail
          # Fully-qualified source refs -> grype -> fail if over Critical/High max.
          python3 scripts/list-source-refs.py | python3 scripts/cve-gate.py

  # Consolidated, human-friendly gate feedback as a sticky PR comment — so a
  # requester sees pass/fail for all three checks in one place without digging
  # through job logs. Runs after the gates regardless of their outcome.
  summary:
    needs: [conftest, policies-check, cve-scan]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Upsert gate-results comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          C: ${{ needs.conftest.result }}
          P: ${{ needs.policies-check.result }}
          V: ${{ needs.cve-scan.result }}
        run: |
          set -euo pipefail
          icon() { case "$1" in
            success) echo "✅ pass";; failure) echo "❌ fail";;
            skipped) echo "⏭️ skipped";; cancelled) echo "🚫 cancelled";;
            *) echo "⚠️ $1";; esac; }
          marker="<!-- catalog-gate-summary -->"
          overall="✅ ready for review"
          if [ "$C" = "failure" ] || [ "$P" = "failure" ] || [ "$V" = "failure" ]; then
            overall="❌ changes needed — see the failing check(s)"
          fi
          body=$(cat <<EOF
          ${marker}
          ## Catalog gate — ${overall}

          | Check | Result | What it verifies |
          |---|---|---|
          | conftest | $(icon "$C") | well-formed entry · source on cgr.dev · pinned tag · package allowlist · signature |
          | policies check | $(icon "$P") | ENFORCE pull policies pass (fips / min-version / max-age / no-eol); DRY_RUN denials are warnings |
          | cve-scan | $(icon "$V") | grype Critical/High counts within threshold |

          _Auto-updated by Catalog gate on each push._
          EOF
          )
          # find an existing summary comment (by marker) and edit it, else create.
          cid=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
                  --jq "map(select(.body|contains(\"${marker}\")))|.[0].id // empty")
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${cid}" -f body="$body" >/dev/null
            echo "updated comment $cid"
          else
            gh pr comment "$PR" --repo "$REPO" --body "$body"
          fi
