# Which pull policies are ENABLED on the org registry, and how — the source of
# truth for policy *activation*, alongside the custom-policy manifests in this
# folder. Applied by goldenctl policy bindings via the Registry policies
# workflow (plan on PR, apply on merge). `chainctl policies enable` is
# idempotent, so re-applying just reconciles mode/params.
#
#   - Custom policies (fips-required / version-cooldown) are defined by the
#     *.yaml manifests here; this file controls their binding + parameters.
#   - System policies (no-eol / cooldown / support-window) have NO manifest —
#     they're built in and enabled by name.
#
# Start everything in DRY_RUN (records what WOULD block); flip a policy to
# ENFORCE here once its decisions look right.
bindings:
  - policy: fips-required
    mode: DRY_RUN
    params:
      allow_non_fips: false

  # 5-day pull-time cooldown for containers (twin of the Libraries cooldown).
  # Staged DRY_RUN first: the deployed policy must exist before the per-policy
  # breakdown can confirm it denies nothing on the current catalog (every
  # catalog version is well older than 5 days), and only then is it flipped to
  # ENFORCE. Keys on the version release date, so rebuilds aren't re-quarantined.
  - policy: version-cooldown
    mode: DRY_RUN
    params:
      cooldown_days: 5

  # NOTE: min-version and max-age were RETIRED. max-age keyed on the version
  # stream's release date, so it false-flagged current supported versions
  # (python:3.12, node:22, jdk-21) as "too old" — redundant with no-eol, which
  # is the correct abandonment signal (real EOL date). min-version was a single
  # global semver floor that couldn't span the catalog's mixed version schemes
  # (3.12 / openjdk-21 / 1.30 / 22), so it sat at a no-op 0.0.0. no-eol +
  # cooldown + malware are the meaningful gates; these two were noise.

  # System policy: deny versions past their end-of-life date. This is the
  # signal we actually want for abandonment — keyed off the real EOL date.
  # First REAL ENFORCE: the per-policy breakdown showed no-eol at 0 Deny /
  # 0 Error across the whole catalog, so enforcing blocks nothing today but puts
  # teeth on end-of-life — any catalog image that later passes its EOL date is
  # blocked at pull.
  - policy: no-eol
    mode: ENFORCE
