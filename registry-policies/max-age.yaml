# Chainguard custom container policy — freshness gate for the golden registry.
# CVE counts are NOT available to pull policies (the input carries only package
# lifecycle metadata), so this is the registry-side PROXY for CVE hygiene: an
# image whose main package build is stale has, by definition, missed newer
# rebuilds/patches. It is the inverse of the built-in `cooldown` policy —
# cooldown blocks versions that are too NEW; this blocks versions too OLD.
#
#   Validate:  chainctl policies custom validate --file registry-policies/max-age.yaml
#   Create:    chainctl policies custom create   --file registry-policies/max-age.yaml --parent=$CHAINGUARD_ORG
#   Stage:     chainctl policies enable --policy=max-age --mode=DRY_RUN  --param=max_age_days=30 --parent=$CHAINGUARD_ORG
#   Enforce:   chainctl policies enable --policy=max-age --mode=ENFORCE --param=max_age_days=30 --parent=$CHAINGUARD_ORG
name: max-age
description: Deny images whose main package was released more than max_age_days ago (freshness / CVE-hygiene proxy).
supported_resource_type: registry.chainguard.dev/Repo@v1
expression_type: EXPRESSION_TYPE_REGO
parameters:
  - name: max_age_days
    type: PARAMETER_TYPE_NUMBER
    description: Maximum allowed age, in days, of the main package's release date.
    default: 30
expression: |
  package chainguard.policies

  import rego.v1

  default allow := false

  # Parse an RFC3339 date/datetime to epoch nanoseconds. Chainguard release
  # metadata is RFC3339; tolerate a bare "YYYY-MM-DD" by assuming midnight UTC.
  _ns(s) := t if {
    t := time.parse_rfc3339_ns(s)
  } else := t if {
    t := time.parse_rfc3339_ns(sprintf("%sT00:00:00Z", [s]))
  }

  # No release date on record -> this policy can't assess age, so it does not
  # block here (freshness is simply unknown; other policies still apply).
  allow if not has_release_date

  has_release_date if {
    input.main_package_version.releaseDate
    input.main_package_version.releaseDate != ""
  }

  # Fresh enough: released within max_age_days of the pull/evaluation time.
  allow if {
    has_release_date
    released := _ns(input.main_package_version.releaseDate)
    now := _ns(input.create_time)
    age_days := (now - released) / ((1000 * 1000 * 1000) * 60 * 60 * 24)
    age_days <= input.parameters.max_age_days
  }
