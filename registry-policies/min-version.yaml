# Chainguard custom container policy — enforce a version floor on the golden
# registry so end-of-support majors can't be pulled/promoted. Uses semver to
# compare the main package's version stream against a per-binding floor.
#
# Non-semver version streams (e.g. `latest`, `openjdk-21`, date-based tags) and
# images with no main-package version on record CAN'T be floor-compared, so this
# policy does not block them — it denies ONLY a valid semver that is actually
# below the floor.
#
# The policy is DEFAULT-ALLOW and denies only on a definite below-floor semver.
# An earlier default-deny formulation (enumerate the allow cases, else deny)
# fail-closed on version shapes it didn't recognise — it denied the jre streams
# (jre:latest / jre:openjdk-21 / jre:openjdk-21-dev) even at floor 0.0.0, because
# their main-package version matched neither allow rule and fell through to the
# default deny. Default-allow makes an unrecognised/missing version non-blocking
# by construction, so the floor gate only ever blocks what it can actually
# compare.
#
#   chainctl policies enable --policy=min-version --mode=ENFORCE \
#     --param=floor=3.11.0 --parent=$CHAINGUARD_ORG
name: min-version
description: Deny images whose main package is a valid semver below the configured floor (non-semver versions are not blocked).
supported_resource_type: registry.chainguard.dev/Repo@v1
expression_type: EXPRESSION_TYPE_REGO
parameters:
  - name: floor
    type: PARAMETER_TYPE_STRING
    description: Minimum acceptable main-package version (full semver, e.g. "3.11.0").
    default: "0.0.0"
expression: |
  package chainguard.policies

  import rego.v1

  # Default-allow: the floor gate blocks only what it can definitely compare.
  default allow := true

  # Deny ONLY when the main-package version is a valid semver strictly below the
  # floor. Anything else — a non-semver stream (latest / openjdk-21 / date tags)
  # or a missing version — leaves `allow` at its default of true, so this policy
  # never fail-closes on a version shape it can't floor-compare. Other policies
  # still apply.
  allow := false if {
    semver.is_valid(input.main_package_version.version)
    semver.compare(input.main_package_version.version, input.parameters.floor) < 0
  }
