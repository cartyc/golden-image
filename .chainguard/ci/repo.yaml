version: 1
# Chainguard Checks: the pull-request checks, in hardened microVMs with no
# network unless a check lists hosts, and no secrets. "Chainguard Checks
# (presubmit)" is the required check on main.
#   lint, conftest, goldenctl   offline; these replaced validate.yml's yamllint,
#                               parse and overlay-check steps, goldenctl.yml and
#                               the conftest job of catalog-gate.yml
#   catalog-exists, cve-scan    on cgr.dev through the cgr-pull workload identity
#                               (.chainguard/ci/identities.yaml), which only
#                               cartyc's PRs and post-merge runs get, so
#                               validate-catalog.yml and the cve-scan job of
#                               catalog-gate.yml still run, to cover other PRs
# Still on Actions: actionlint with shellcheck (validate.yml; the VM has no
# shellcheck package), the policies-check job (it calls the Chainguard API) and
# the sticky PR comments, because checks get no GitHub token.
#   chainctl checks validate .                  check this file offline
#   chainctl checks run --check lint --watch    run a pushed commit, advisory
environment:
  packages:
    - bash
    - coreutils
    - findutils
    - actionlint
    - yamllint
    - yq
    - conftest
    - go-1.26
checks:
  lint:
    description: actionlint, yamllint, and every config parses
    shell: bash
    script: |
      set -euo pipefail
      actionlint -color
      yamllint -d relaxed .github/ cgr-sync.yaml custom-assembly/
      find custom-assembly -name '*.yaml' -print0 | xargs -0 -n1 yq -e '.' >/dev/null
      yq -e '.' cgr-sync.yaml >/dev/null
      echo "configs parse"

  conftest:
    description: the catalog and Custom Assembly overlays are within policy
    when:
      changed: ["cgr-sync.yaml", "custom-assembly/**", "policy/**", ".chainguard/**"]
    shell: bash
    script: |
      set -euo pipefail
      conftest test --policy policy/conftest --all-namespaces cgr-sync.yaml
      conftest test --policy policy/conftest --all-namespaces custom-assembly/overlays/*.yaml

  goldenctl:
    description: go vet, test and build, then the offline overlay check
    when:
      changed: ["goldenctl/**", "custom-assembly/**", ".chainguard/**"]
    network:
      # proxy.golang.org redirects module zips to storage.googleapis.com.
      egress: [proxy.golang.org, sum.golang.org, storage.googleapis.com]
    shell: bash
    script: |
      set -euo pipefail
      cd goldenctl
      go vet ./...
      go test ./...
      go build -o /tmp/goldenctl .
      cd ..
      /tmp/goldenctl overlay check

  catalog-exists:
    description: every source image:tag in cgr-sync.yaml exists on cgr.dev
    when:
      changed: ["cgr-sync.yaml", ".chainguard/**"]
    identity: cgr-pull
    environment:
      packages: [bash, go-1.26]
    vars:
      CHAINGUARD_ORG: chriscarty.com
    network:
      # Go modules to build goldenctl, then manifest HEADs on cgr.dev.
      egress: [proxy.golang.org, sum.golang.org, storage.googleapis.com, cgr.dev]
    shell: bash
    script: |
      set -euo pipefail
      go build -C goldenctl -buildvcs=false -o /tmp/goldenctl .
      /tmp/goldenctl catalog refs | /tmp/goldenctl catalog verify

  cve-scan:
    description: grype finds no Critical or High CVEs (beyond unexpired waivers in policy/cve-exceptions.yaml) in the images this change adds
    when:
      changed: ["cgr-sync.yaml", "custom-assembly/**", "policy/cve-exceptions.yaml", ".chainguard/**"]
    identity: cgr-pull
    environment:
      packages: [bash, coreutils, git, go-1.26, grype]
    vars:
      CHAINGUARD_ORG: chriscarty.com
      MAX_CRITICAL: "0"
      MAX_HIGH: "0"
      # The VM is arm64; scan the amd64 images the Actions runner scans.
      GRYPE_PLATFORM: linux/amd64
      # No Docker daemon in the VM: pull straight from the registry.
      GRYPE_DEFAULT_IMAGE_PULL_SOURCE: registry
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
    network:
      # Go modules; cgr.dev and the R2 host it redirects layer downloads to,
      # listed exactly; and the grype database.
      egress:
        - proxy.golang.org
        - sum.golang.org
        - storage.googleapis.com
        - cgr.dev
        - 9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com
        - grype.anchore.io
    timeout: 30m
    shell: bash
    script: |
      set -euo pipefail
      go build -C goldenctl -buildvcs=false -o /tmp/goldenctl .
      # Only the refs this change adds, against the base the run merges into.
      BASE_SHA="${CHAINGUARD_BASE_REVISION:-}" CUR_SHA=HEAD /tmp/goldenctl catalog changed \
        | /tmp/goldenctl gate cve
